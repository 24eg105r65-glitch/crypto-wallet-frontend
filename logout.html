<!DOCTYPE html>
<html lang="en" class="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signed Out — CryptoWallet</title>

    <!-- Google Fonts: Manrope (Display) & Inter (UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bg: {
                            main: '#0B0D0C',
                            secondary: '#111513',
                            surface: '#161B18'
                        },
                        text: {
                            primary: '#F5F7F5',
                            secondary: '#A0AAA3',
                            muted: '#707B73'
                        },
                        accent: {
                            DEFAULT: '#79E6A0',
                            dim: '#52c27b'
                        },
                        border: 'rgba(255, 255, 255, 0.08)'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Manrope', 'sans-serif']
                    }
                }
            }
        };
    </script>
</head>
<body class="bg-bg-main text-text-primary antialiased min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md bg-bg-surface border border-border p-8 rounded-2xl text-center shadow-2xl relative">
        <div class="w-14 h-14 mx-auto mb-4 rounded-xl bg-bg-secondary border border-border flex items-center justify-center text-accent">
            <i class="fas fa-arrow-right-from-bracket text-xl"></i>
        </div>
        <h1 class="font-display font-bold text-2xl text-text-primary mb-2">Signed Out Successfully</h1>
        <p class="text-text-secondary text-sm mb-6">Your cryptographic session has been invalidated and local credentials cleared.</p>
        
        <div class="flex flex-col gap-3">
            <a href="login.html" class="w-full bg-accent hover:bg-accent-dim text-bg-main font-display font-bold py-3 rounded-xl transition-all shadow-md">
                Sign In Again
            </a>
            <a href="index.html" class="w-full bg-bg-secondary hover:bg-bg-main text-text-secondary hover:text-text-primary py-2.5 rounded-xl border border-border text-sm transition-colors">
                Return to Homepage
            </a>
        </div>
    </div>

    <script>
        // Clear local session state
        localStorage.removeItem('cryptowallet_session');
    </script>
</body>
</html>
