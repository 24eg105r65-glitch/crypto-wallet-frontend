<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — CryptoWallet</title>
    <meta name="description" content="Open your free CryptoWallet account. Track expenses, categorize spending, and build financial security.">

    <!-- Google Fonts: Manrope (Display) & Inter (UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Tailwind CSS with Reference Tokens -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bg: {
                            main: '#0B0D0C',
                            secondary: '#111513',
                            surface: '#161B18',
                            elevated: '#1D2420'
                        },
                        text: {
                            primary: '#F5F7F5',
                            secondary: '#A0AAA3',
                            muted: '#707B73'
                        },
                        accent: {
                            DEFAULT: '#79E6A0',
                            dim: '#52c27b',
                            glow: 'rgba(121, 230, 160, 0.15)'
                        },
                        negative: '#F07878',
                        border: 'rgba(255, 255, 255, 0.08)'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Manrope', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        };
    </script>

    <style>
        body {
            background-color: #0B0D0C;
            color: #F5F7F5;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }
        .subtle-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        }
    </style>
</head>
<body class="selection:bg-accent selection:text-bg-main antialiased relative flex flex-col justify-between">

    <!-- Subtle Background Texture -->
    <div class="fixed inset-0 subtle-grid pointer-events-none z-0 opacity-60"></div>
    <div class="fixed top-0 inset-x-0 h-[400px] bg-[radial-gradient(circle_at_50%_0%,rgba(121,230,160,0.06)_0%,transparent_70%)] pointer-events-none z-0"></div>

    <!-- Header Navigation Bar -->
    <header class="relative z-20 py-5 px-6 md:px-12 border-b border-border/60 bg-bg-main/80 backdrop-blur-md">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3 group">
                <div class="w-8 h-8 rounded-lg bg-bg-surface border border-border flex items-center justify-center text-accent group-hover:border-accent/50 transition-colors">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M21 7V17C21 19.2091 19.2091 21 17 21H7C4.79086 21 3 19.2091 3 17V7C3 4.79086 4.79086 3 7 3H17C19.2091 3 21 4.79086 21 7Z" stroke="currentColor" stroke-width="2"/>
                        <path d="M16 12C16 13.1046 16.8954 14 18 14H21V10H18C16.8954 10 16 10.8954 16 12Z" stroke="currentColor" stroke-width="2"/>
                        <circle cx="18" cy="12" r="1" fill="currentColor"/>
                    </svg>
                </div>
                <span class="font-display font-bold text-lg tracking-tight text-text-primary">CryptoWallet</span>
            </a>

            <div class="flex items-center gap-4 text-sm">
                <span class="text-text-muted hidden sm:inline">Already have an account?</span>
                <a href="login.html" class="font-medium text-accent hover:underline">Sign in</a>
            </div>
        </div>
    </header>

    <!-- Main Register View -->
    <main class="relative z-10 flex-1 flex items-center justify-center px-4 py-10">
        <div class="w-full max-w-lg">
            
            <!-- Alert Banner -->
            <div id="alert-banner" class="hidden mb-4 p-3.5 rounded-xl text-sm font-medium border flex items-center gap-2.5 transition-all"></div>

            <!-- Signup Card -->
            <div class="bg-bg-surface border border-border p-7 sm:p-9 rounded-2xl shadow-2xl relative overflow-hidden">
                <div class="absolute -top-16 -right-16 w-36 h-36 bg-accent/5 rounded-full blur-2xl pointer-events-none"></div>

                <!-- Brand Crest -->
                <div class="text-center mb-6">
                    <div class="w-12 h-12 mx-auto mb-3.5 rounded-xl bg-bg-elevated border border-border flex items-center justify-center text-accent shadow-sm">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <line x1="19" x2="19" y1="8" y2="14"/>
                            <line x1="22" x2="16" y1="11" y2="11"/>
                        </svg>
                    </div>
                    <h1 class="font-display font-bold text-2xl text-text-primary tracking-tight">Create your CryptoWallet account</h1>
                    <p class="text-text-secondary text-sm mt-1">Start tracking expenses and managing wealth in one view</p>
                </div>

                <!-- Signup Form -->
                <form id="register-form" onsubmit="handleRegisterSubmit(event)" method="post" action="/register" class="space-y-4">
                    <input type="hidden" name="_csrf" value="" id="csrf-token" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div>
                        <label for="fullNameInput" class="block text-xs font-semibold uppercase tracking-wider text-text-muted mb-1.5">Full Name</label>
                        <input type="text" id="fullNameInput" name="fullName" required
                               class="w-full px-4 py-2.5 bg-bg-secondary border border-border rounded-xl text-text-primary text-sm focus:border-accent focus:outline-none placeholder:text-text-muted transition-colors font-medium"
                               placeholder="e.g. Adabala Pushkaran">
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                        <div>
                            <label for="usernameInput" class="block text-xs font-semibold uppercase tracking-wider text-text-muted mb-1.5">Username</label>
                            <input type="text" id="usernameInput" name="username" required
                                   class="w-full px-4 py-2.5 bg-bg-secondary border border-border rounded-xl text-text-primary text-sm focus:border-accent focus:outline-none placeholder:text-text-muted transition-colors font-medium"
                                   placeholder="e.g. pushkaran">
                        </div>
                        <div>
                            <label for="emailInput" class="block text-xs font-semibold uppercase tracking-wider text-text-muted mb-1.5">Email Address</label>
                            <input type="email" id="emailInput" name="email" required
                                   class="w-full px-4 py-2.5 bg-bg-secondary border border-border rounded-xl text-text-primary text-sm focus:border-accent focus:outline-none placeholder:text-text-muted transition-colors font-medium"
                                   placeholder="pushkaran@example.com">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                        <div>
                            <label for="passwordInput" class="block text-xs font-semibold uppercase tracking-wider text-text-muted mb-1.5">Password</label>
                            <input type="password" id="passwordInput" name="password" required minlength="8"
                                   class="w-full px-4 py-2.5 bg-bg-secondary border border-border rounded-xl text-text-primary text-sm focus:border-accent focus:outline-none placeholder:text-text-muted transition-colors font-mono"
                                   placeholder="Min 8 characters">
                        </div>
                        <div>
                            <label for="confirmPasswordInput" class="block text-xs font-semibold uppercase tracking-wider text-text-muted mb-1.5">Confirm Password</label>
                            <input type="password" id="confirmPasswordInput" name="confirmPassword" required minlength="8"
                                   class="w-full px-4 py-2.5 bg-bg-secondary border border-border rounded-xl text-text-primary text-sm focus:border-accent focus:outline-none placeholder:text-text-muted transition-colors font-mono"
                                   placeholder="Repeat password">
                        </div>
                    </div>

                    <div class="pt-1">
                        <label class="flex items-start gap-2.5 cursor-pointer select-none">
                            <input type="checkbox" id="terms-agree" required checked class="mt-0.5 w-4 h-4 rounded bg-bg-secondary border-border text-accent focus:ring-0 focus:ring-offset-0 accent-[#79E6A0]">
                            <span class="text-xs text-text-secondary leading-relaxed">
                                I agree to the <a href="terms.html" class="text-accent hover:underline">Terms of Service</a> and acknowledge the client-side encryption <a href="privacy.html" class="text-accent hover:underline">Privacy Policy</a>.
                            </span>
                        </label>
                    </div>

                    <button type="submit" id="submit-btn" class="w-full mt-2 bg-accent hover:bg-accent-dim text-bg-main font-display font-bold py-3 rounded-xl transition-all shadow-md flex items-center justify-center gap-2">
                        <span>Create Account & Start Tracking</span>
                        <i class="fas fa-arrow-right text-xs"></i>
                    </button>
                </form>

                <!-- Footer link to login -->
                <div class="mt-6 text-center text-xs text-text-muted">
                    Already have an account? 
                    <a href="login.html" class="text-accent hover:underline font-medium">Sign in to your vault</a>
                </div>
            </div>

            <!-- Return link -->
            <div class="mt-6 text-center">
                <a href="index.html" class="text-xs text-text-muted hover:text-text-primary transition-colors flex items-center justify-center gap-1.5">
                    <i class="fas fa-arrow-left text-[10px]"></i>
                    <span>Back to Overview</span>
                </a>
            </div>
        </div>
    </main>

    <!-- Simple Minimal Footer -->
    <footer class="relative z-10 py-5 px-6 border-t border-border/40 text-center text-xs text-text-muted font-mono">
        © 2026 CryptoWallet Platform • Engineered by Adabala Pushkaran (24EG105R65)
    </footer>

    <script>
        // Check query param for prefilled email from landing page CTA
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const emailParam = params.get('email');
            if (emailParam) {
                document.getElementById('emailInput').value = emailParam;
                const userGuess = emailParam.split('@')[0].replace(/[^a-zA-Z0-9]/g, '');
                if (userGuess) {
                    document.getElementById('usernameInput').value = userGuess;
                }
            }
        });

        function showAlert(msg, type) {
            const banner = document.getElementById('alert-banner');
            banner.classList.remove('hidden', 'bg-accent/10', 'border-accent/30', 'text-accent', 'bg-negative/10', 'border-negative/30', 'text-negative');
            
            if (type === 'success') {
                banner.classList.add('bg-accent/10', 'border-accent/30', 'text-accent');
                banner.innerHTML = `<i class="fas fa-circle-check"></i> <span>${msg}</span>`;
            } else {
                banner.classList.add('bg-negative/10', 'border-negative/30', 'text-negative');
                banner.innerHTML = `<i class="fas fa-triangle-exclamation"></i> <span>${msg}</span>`;
            }
        }

        function handleRegisterSubmit(e) {
            if (e && e.preventDefault) e.preventDefault();
            const fullName = document.getElementById('fullNameInput').value.trim();
            const username = document.getElementById('usernameInput').value.trim();
            const email = document.getElementById('emailInput').value.trim();
            const pass = document.getElementById('passwordInput').value;
            const confirmPass = document.getElementById('confirmPasswordInput').value;
            const btn = document.getElementById('submit-btn');

            if (pass !== confirmPass) {
                showAlert('Passwords do not match. Please verify both entries.', 'error');
                return;
            }

            // Create persistent session in localStorage
            const session = {
                username: username,
                fullName: fullName,
                email: email,
                role: 'ROLE_USER',
                token: 'cw_jwt_' + Math.random().toString(36).substring(2) + Date.now(),
                timestamp: new Date().toISOString()
            };

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-circle-notch fa-spin text-sm"></i> <span>Creating account & enclaves...</span>`;
            showAlert('Account created successfully! Initializing default wallet balances...', 'success');

            localStorage.setItem('cryptowallet_session', JSON.stringify(session));

            // Redirect smoothly to dashboard
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 700);
        }
    </script>
</body>
</html>
