<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="en">
<head th:replace="~{fragments/layout :: html-head(title=${pageTitle}, description='Security and ledger notifications')}"></head>
<body>

<div th:replace="~{fragments/layout :: ticker-ribbon}"></div>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="main-content">
    <div class="container" style="max-width: 800px;">
        <!-- Header -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <div>
                <h1 style="font-size: 1.85rem;">Notifications & Alerts</h1>
                <p>Real-time security updates, incoming crypto alerts, and system notices.</p>
            </div>
            <form th:action="@{/notifications/read-all}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-secondary btn-sm">
                    <i class="fas fa-check-double"></i> Mark All as Read
                </button>
            </form>
        </div>

        <!-- Flash Messages -->
        <div th:if="${successMessage}" class="alert alert-success">
            <i class="fas fa-circle-check"></i>
            <span th:text="${successMessage}">Success message</span>
        </div>

        <!-- Notification List -->
        <div style="display: flex; flex-direction: column; gap: 1rem;">
            <div th:if="${#lists.isEmpty(notifications)}" class="glass-card" style="text-align: center; color: var(--text-dim); padding: 3rem;">
                <i class="fas fa-bell-slash" style="font-size: 2.5rem; margin-bottom: 1rem; color: var(--text-dim);"></i>
                <p>You have no notifications at this time.</p>
            </div>

            <div th:each="n : ${notifications}" class="glass-card"
                 th:style="${!n.read ? 'border-left: 4px solid var(--primary); background: rgba(20, 30, 55, 0.85);' : ''}"
                 style="padding: 1.25rem 1.5rem;">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem;">
                    <div style="display: flex; gap: 1rem; align-items: flex-start;">
                        <div style="width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0;"
                             th:style="${n.type.name() == 'TX_SUCCESS' || n.type.name() == 'TX_RECEIVED' || n.type.name() == 'DEPOSIT_CONFIRMED' ? 'background: rgba(16,185,129,0.15); color: #10b981;' : (n.type.name() == 'SECURITY_ALERT' ? 'background: rgba(239,68,68,0.15); color: #ef4444;' : 'background: rgba(6,182,212,0.15); color: #06b6d4;')}">
                            <i th:class="${n.type.name() == 'TX_SUCCESS' || n.type.name() == 'TX_RECEIVED' || n.type.name() == 'DEPOSIT_CONFIRMED' ? 'fas fa-arrow-down-to-bracket' : (n.type.name() == 'SECURITY_ALERT' ? 'fas fa-shield-halved' : 'fas fa-info-circle')}"></i>
                        </div>
                        <div>
                            <div style="font-weight: 700; font-size: 1rem; margin-bottom: 0.25rem;" th:text="${n.title}">Notification Title</div>
                            <p style="font-size: 0.88rem; color: var(--text-muted); margin-bottom: 0.5rem;" th:text="${n.message}">Notification message body</p>
                            <div style="font-size: 0.75rem; color: var(--text-dim);" th:text="${#temporals.format(n.createdAt, 'dd MMM yyyy, HH:mm')}">06 Oct 2026, 21:00</div>
                        </div>
                    </div>

                    <div style="display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0;">
                        <form th:if="${!n.read}" th:action="@{'/notifications/read/' + ${n.id}}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-secondary btn-sm" title="Mark as read" style="padding: 0.25rem 0.5rem;">
                                <i class="fas fa-check"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
