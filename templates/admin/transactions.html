<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head th:replace="~{fragments/layout :: html-head(title=${pageTitle}, description='System ledger transactions audit')}"></head>
<body>

<div th:replace="~{fragments/layout :: ticker-ribbon}"></div>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="main-content">
    <div class="container">
        <!-- Header -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <div>
                <a th:href="@{/admin}" class="btn btn-secondary btn-sm" style="margin-bottom: 0.5rem;">
                    <i class="fas fa-arrow-left"></i> Admin Center
                </a>
                <h1 style="font-size: 1.85rem;">System-Wide Ledger Audit</h1>
            </div>
        </div>

        <!-- Table -->
        <div class="glass-card" style="padding: 0;">
            <div class="table-responsive">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>Type</th>
                            <th>Tx Hash</th>
                            <th>Amount</th>
                            <th>INR Value</th>
                            <th>Sender</th>
                            <th>Receiver</th>
                            <th>Status</th>
                            <th>Timestamp</th>
                            <th>Receipt</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="tx : ${transactions}">
                            <td>
                                <span style="font-size: 0.8rem; font-weight: 700; padding: 0.25rem 0.6rem; border-radius: 6px;"
                                      th:style="${tx.txType.name() == 'TRANSFER' ? 'background: rgba(6,182,212,0.15); color: #06b6d4;' : 'background: rgba(16,185,129,0.15); color: #10b981;'}"
                                      th:text="${tx.txType}">TRANSFER</span>
                            </td>
                            <td>
                                <span class="font-mono" style="font-size: 0.82rem; color: var(--text-muted);"
                                      th:text="|${#strings.substring(tx.txHash, 0, 10)}...${#strings.substring(tx.txHash, tx.txHash.length() - 6)}|">0x8f2d...0b1c</span>
                            </td>
                            <td class="font-mono" style="font-weight: 700;" th:text="|${tx.amount} ${tx.currency.code}|">1.50000000 BTC</td>
                            <td class="font-mono" style="color: var(--text-main);" th:text="|₹${#numbers.formatDecimal(tx.fiatEquivalentInr, 1, 'COMMA', 2, 'POINT')}|">₹98,25,000</td>
                            <td>
                                <span th:if="${tx.senderWallet != null}" th:text="${tx.senderWallet.user.username}">pushkaran</span>
                                <span th:if="${tx.senderWallet == null}" style="color: var(--text-dim);">GATEWAY / FAUCET</span>
                            </td>
                            <td>
                                <span th:if="${tx.receiverWallet != null}" th:text="${tx.receiverWallet.user.username}">alice</span>
                                <span th:if="${tx.receiverWallet == null}" style="color: var(--text-dim);">EXTERNAL / WITHDRAW</span>
                            </td>
                            <td>
                                <span class="badge-status confirmed" th:text="${tx.status}">CONFIRMED</span>
                            </td>
                            <td style="font-size: 0.82rem; color: var(--text-dim);" th:text="${#temporals.format(tx.createdAt, 'dd MMM yyyy, HH:mm')}">06 Oct 2026</td>
                            <td>
                                <a th:href="@{'/transactions/' + ${tx.id} + '/receipt'}" class="btn btn-secondary btn-sm" style="padding: 0.2rem 0.5rem; font-size: 0.75rem;">
                                    <i class="fas fa-receipt"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
