<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head th:replace="~{fragments/layout :: html-head(title=${pageTitle}, description='Manage currency exchange rates and valuations')}"></head>
<body>

<div th:replace="~{fragments/layout :: ticker-ribbon}"></div>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="main-content">
    <div class="container">
        <!-- Header -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <div>
                <a th:href="@{/admin}" class="btn btn-secondary btn-sm" style="margin-bottom: 0.5rem;">
                    <i class="fas fa-arrow-left"></i> Admin Center
                </a>
                <h1 style="font-size: 1.85rem;">Cryptocurrency Rates & Market Feeds</h1>
            </div>
        </div>

        <!-- Flash Messages -->
        <div th:if="${successMessage}" class="alert alert-success">
            <i class="fas fa-circle-check"></i>
            <span th:text="${successMessage}">Success message</span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger">
            <i class="fas fa-triangle-exclamation"></i>
            <span th:text="${errorMessage}">Error message</span>
        </div>

        <!-- Currencies Grid / Form -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem;">
            <div th:each="c : ${currencies}" class="glass-card">
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem;">
                    <div style="display: flex; align-items: center; gap: 0.75rem;">
                        <div style="width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem;"
                             th:style="|background: ${c.badgeColor}22;|">
                            <i th:class="${c.iconClass}" th:style="|color: ${c.badgeColor};|"></i>
                        </div>
                        <div>
                            <div style="font-weight: 700; font-size: 1.05rem;" th:text="${c.name}">Bitcoin</div>
                            <div style="font-size: 0.75rem; color: var(--text-dim);" th:text="|Code: ${c.code} (${c.symbol})|">Code: BTC (₿)</div>
                        </div>
                    </div>
                    <span class="wallet-badge-pill" th:style="|color: ${c.badgeColor};|" th:text="${c.code}">BTC</span>
                </div>

                <form th:action="@{/admin/currencies/update}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="currencyId" th:value="${c.id}"/>

                    <div class="form-group">
                        <label class="form-label">Exchange Rate (INR ₹)</label>
                        <input type="number" name="inrRate" th:value="${c.exchangeRateInr}" class="form-control font-mono" step="0.01" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Exchange Rate (USD $)</label>
                        <input type="number" name="usdRate" th:value="${c.exchangeRateUsd}" class="form-control font-mono" step="0.0001" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">24h Market Change (%)</label>
                        <input type="number" name="change24h" th:value="${c.change24h}" class="form-control font-mono" step="0.01">
                    </div>

                    <button type="submit" class="btn btn-secondary btn-sm" style="width: 100%;">
                        <i class="fas fa-check"></i> Update Rate
                    </button>
                </form>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
