<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head th:replace="~{fragments/layout :: html-head(title=${pageTitle}, description='Manage system user accounts')}"></head>
<body>

<div th:replace="~{fragments/layout :: ticker-ribbon}"></div>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="main-content">
    <div class="container">
        <!-- Header -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <div>
                <a th:href="@{/admin}" class="btn btn-secondary btn-sm" style="margin-bottom: 0.5rem;">
                    <i class="fas fa-arrow-left"></i> Admin Center
                </a>
                <h1 style="font-size: 1.85rem;">User Account Administration</h1>
            </div>
        </div>

        <!-- Flash Messages -->
        <div th:if="${successMessage}" class="alert alert-success">
            <i class="fas fa-circle-check"></i>
            <span th:text="${successMessage}">Success message</span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger">
            <i class="fas fa-triangle-exclamation"></i>
            <span th:text="${errorMessage}">Error message</span>
        </div>

        <!-- Users Table -->
        <div class="glass-card" style="padding: 0;">
            <div class="table-responsive">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Joined</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${users}">
                            <td>
                                <div style="font-weight: 700;" th:text="${u.fullName}">Adabala Pushkaran</div>
                                <div class="font-mono" style="font-size: 0.78rem; color: var(--text-dim);" th:text="|@${u.username}|">@pushkaran</div>
                            </td>
                            <td th:text="${u.email}">user@cryptowallet.io</td>
                            <td th:text="${u.phoneNumber != null ? u.phoneNumber : 'N/A'}">+91 ...</td>
                            <td>
                                <span style="font-size: 0.75rem; font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 4px;"
                                      th:style="${u.role.name() == 'ROLE_ADMIN' ? 'background: rgba(121,230,160,0.18); color: #79E6A0;' : 'background: rgba(255,255,255,0.08); color: #F5F7F5;'}"
                                      th:text="${u.role}">ROLE_USER</span>
                            </td>
                            <td>
                                <span class="badge-status" th:classappend="${u.enabled ? 'confirmed' : 'failed'}"
                                      th:text="${u.enabled ? 'ACTIVE' : 'SUSPENDED'}">ACTIVE</span>
                            </td>
                            <td style="font-size: 0.82rem; color: var(--text-dim);" th:text="${#temporals.format(u.createdAt, 'dd MMM yyyy')}">06 Oct 2026</td>
                            <td>
                                <form th:action="@{'/admin/users/toggle/' + ${u.id}}" method="post" style="display: inline;">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-secondary btn-sm"
                                            th:style="${u.enabled ? 'color: #ef4444;' : 'color: #10b981;'}"
                                            th:text="${u.enabled ? 'Suspend' : 'Activate'}">
                                        Suspend
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
